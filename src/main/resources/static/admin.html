<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Suivi des commandes</title>
    <script>
        (function () {
            var stored = localStorage.getItem('notificationOrderLive:theme');
            if (stored) document.documentElement.setAttribute('data-theme', stored);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="page">
    <header class="page-header">
        <div>
            <p class="eyebrow">Back office</p>
            <h1>Commandes</h1>
        </div>
        <div class="header-actions">
            <button id="theme-toggle" type="button" class="theme-toggle"></button>
            <div id="connection-status" class="connection-pill">Connexion...</div>
        </div>
    </header>

    <form id="create-order-form" class="create-form">
        <input type="text" id="customer-id-input" placeholder="Nom du client" required>
        <button type="submit" class="btn btn-primary">Nouvelle commande</button>
    </form>

    <div id="orders-grid" class="orders-grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/status-labels.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/ws.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
