<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="page page-narrow">
    <header class="page-header">
        <div>
            <p class="eyebrow">Suivi</p>
            <h1>Votre commande</h1>
        </div>
        <div id="connection-status" class="connection-pill">Connexion...</div>
    </header>

    <div id="order-missing" class="empty-state hidden"></div>

    <div id="order-panel" class="hidden">
        <section class="status-hero">
            <span id="current-status" class="status-pill status-pill-lg"></span>
            <p class="order-meta">Commande <strong id="order-id"></strong> - client <span id="order-customer"></span></p>
        </section>

        <ol id="timeline" class="stepper"></ol>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/status-labels.js"></script>
<script src="/js/ws.js"></script>
<script src="/js/client.js"></script>
</body>
</html>
